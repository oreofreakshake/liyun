<p style="text-align: center">بسم الله الرحمن الرحيم</p>
<p style="text-align: end">[ގޭގެ ނަން]<br>[ރަށް]</p>
<p>[އިދާރާގެ ނަން]ގެ [މަޤާމު] [ނަން]އަށް،</p>
<p>ވެދުން ސަލާމަށް ފަހު ދަންނަވަމެވެ.</p>
<p style="text-align: justify">[ސިޓީގެ ތަފްޞީލު]</p>
<p style="text-align: justify">[ސިޓީގެ ތަފްޞީލު]</p>
<p>އިޙްތިރާމް ޤަބޫލުކުރެއްވުން އެދެމެވެ.</p>
<p>[ތާރީޚް]</p>
<p>ޚާދިމުކުމް،</p>
<p>(ސޮއި)</p>
<p>[ނަން]<br>[ކާޑު ނަންބަރު]</p>
<p style="text-align: end">[އިދާރާގެ ނަން]<br>[ރަށް]، ދިވެހިރާއްޖެ</p>
