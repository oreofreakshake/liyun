<h2 style="text-align: center">އިންޓަރނަލް މެމޯ</h2>
<p style="text-align: center">[އިދާރާގެ ނަން]</p>
<p>ނަންބަރު: [XX/MEMO/2026/00]</p>
<p>ތާރީޚް: [ތާރީޚް]</p>
<p>އަށް: [ނަން / ބައި]<br>އިން: [ނަން، މަޤާމު]<br><strong>މައުޟޫޢު: [މައުޟޫޢު]</strong></p>
<p>ދަންނަވަމެވެ.</p>
<p>[މެމޯގެ ތަފްޞީލު]</p>
<ol>
<li><p>[ފުރަތަމަ ނުކުތާ]</p></li>
<li><p>[ދެވަނަ ނުކުތާ]</p></li>
</ol>
<p>ވީމާ، މިކަމަށް ސަމާލުކަން ދެއްވުން އެދެމެވެ.</p>
<p>(ސޮއި)</p>
<p>[ނަން]<br>[މަޤާމު]</p>
